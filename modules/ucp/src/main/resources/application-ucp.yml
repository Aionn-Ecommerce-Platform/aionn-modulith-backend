aionn:
  ucp:
    version: "2026-08-25"
    # Public base URL advertised through /.well-known/ucp. Leave unset unless the
    # deployment has a real endpoint: a localhost fallback would publish an
    # unreachable URL to every UCP agent. The dev profile opts into localhost.
    rest-endpoint: "${UCP_REST_ENDPOINT:}"
    business-name: "${UCP_BUSINESS_NAME:Aionn Commerce}"
    allowed-schema-prefixes:
      - "https://ucp.dev/schemas/"
    # TLS terminates at the edge. server.forward-headers-strategy keeps
    # request.isSecure() accurate behind the proxy, so plain HTTP is rejected by
    # default. Local development overrides this in application-dev.yml.
    require-https: "${UCP_REQUIRE_HTTPS:true}"
    # Every capability below has a real controller wired to production ports
    # (catalog / checkout / order / identity), so they are advertised by default.
    # Set one to false to hide it during maintenance.
    capabilities:
      cart: ${UCP_CAPABILITY_CART:true}
      checkout: ${UCP_CAPABILITY_CHECKOUT:true}
      catalog: ${UCP_CAPABILITY_CATALOG:true}
      order: ${UCP_CAPABILITY_ORDER:true}
      identity-linking: ${UCP_CAPABILITY_IDENTITY_LINKING:true}
    # Platform/agent API keys, "platformId=secret" pairs, comma separated. Each
    # maps a provisioned secret to the platform it stands for. Empty disables
    # platform auth so local dev and the public discovery endpoint keep working.
    #   UCP_PLATFORM_API_KEYS=plat_a=secretA,plat_b=secretB
    platform-api-keys: ${UCP_PLATFORM_API_KEYS:}
    # Store market currency — UCP minor-unit amounts (price filters, totals) are
    # interpreted in this currency. Must equal the currency catalog pricing emits.
    market-currency: ${UCP_MARKET_CURRENCY:VND}
    # Serving limits for generated carts/checkouts and catalog search. These do
    # not change the pinned wire contract, only how long resources live and how
    # many results an agent may ask for.
    serving:
      cart-expiry-days: ${UCP_SERVING_CART_EXPIRY_DAYS:7}
      checkout-ttl-hours: ${UCP_SERVING_CHECKOUT_TTL_HOURS:6}
      storefront-base-url: ${UCP_SERVING_STOREFRONT_BASE_URL:https://aionn.vn}
      catalog-search-default-limit: ${UCP_SERVING_CATALOG_SEARCH_DEFAULT_LIMIT:10}
      catalog-search-max-limit: ${UCP_SERVING_CATALOG_SEARCH_MAX_LIMIT:100}
    # Shared secret signing outbound webhook payloads. Receiving platforms verify
    # the HMAC over "<timestamp>.<body>" and reject forgeries/replays. Empty
    # disables signing (dev only) — set it in any environment platforms consume.
    webhook-secret: ${UCP_WEBHOOK_SECRET:}
    webhook:
      poll-delay-ms: ${UCP_WEBHOOK_POLL_DELAY_MS:5000}
      batch-size: ${UCP_WEBHOOK_BATCH_SIZE:50}
      max-attempts: ${UCP_WEBHOOK_MAX_ATTEMPTS:10}
    # Ed25519 key pair (base64 PKCS#8 / X.509, PEM or bare) enabling RFC 9421 HTTP
    # Message Signatures. The public half is published as an OKP JWK in
    # /.well-known/ucp keys[], which is where UCP verifiers read it. Both must be
    # set together; the app verifies the pair and fails fast if they don't match.
    signature-private-key: ${UCP_SIGNATURE_PRIVATE_KEY:}
    signature-public-key: ${UCP_SIGNATURE_PUBLIC_KEY:}
    # Periodic sweep that deletes expired checkout-session rows. The JPA adapter
    # enforces expiry on read, so this only reclaims storage. ShedLock-bounded.
    session-cleanup:
      enabled: ${UCP_SESSION_CLEANUP_ENABLED:true}
      delay-ms: ${UCP_SESSION_CLEANUP_DELAY_MS:3600000}
      # Completed/cancelled sessions are kept this long for webhooks and idempotent replays.
      retention-days: ${UCP_SESSION_RETENTION_DAYS:30}
