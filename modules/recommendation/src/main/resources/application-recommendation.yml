recommendation:
  weights:
    view:
      base: ${RECOMMENDATION_WEIGHT_VIEW_BASE:1.0}
      half-life-days: ${RECOMMENDATION_WEIGHT_VIEW_HALF_LIFE_DAYS:14}
    cart-add:
      base: ${RECOMMENDATION_WEIGHT_CART_ADD_BASE:4.0}
      half-life-days: ${RECOMMENDATION_WEIGHT_CART_ADD_HALF_LIFE_DAYS:30}
    purchase:
      base: ${RECOMMENDATION_WEIGHT_PURCHASE_BASE:5.0}
      half-life-days: ${RECOMMENDATION_WEIGHT_PURCHASE_HALF_LIFE_DAYS:180}
  ranking:
    collaborative-weight: ${RECOMMENDATION_RANKING_COLLABORATIVE_WEIGHT:0.50}
    content-weight: ${RECOMMENDATION_RANKING_CONTENT_WEIGHT:0.35}
    popularity-weight: ${RECOMMENDATION_RANKING_POPULARITY_WEIGHT:0.15}
    category-affinity-weight: ${RECOMMENDATION_RANKING_CATEGORY_AFFINITY_WEIGHT:0.45}
    brand-affinity-weight: ${RECOMMENDATION_RANKING_BRAND_AFFINITY_WEIGHT:0.35}
    price-fit-weight: ${RECOMMENDATION_RANKING_PRICE_FIT_WEIGHT:0.20}
    candidate-over-fetch-factor: ${RECOMMENDATION_RANKING_CANDIDATE_OVER_FETCH_FACTOR:3}
    max-candidates: ${RECOMMENDATION_RANKING_MAX_CANDIDATES:200}
  cold-start:
    content-only-threshold: ${RECOMMENDATION_COLD_START_CONTENT_ONLY_THRESHOLD:1}
    full-hybrid-threshold: ${RECOMMENDATION_COLD_START_FULL_HYBRID_THRESHOLD:5}
  profile:
    max-affinities: ${RECOMMENDATION_PROFILE_MAX_AFFINITIES:10}
    lookback-days: ${RECOMMENDATION_PROFILE_LOOKBACK_DAYS:180}
  similarity:
    lookback-days: ${RECOMMENDATION_SIMILARITY_LOOKBACK_DAYS:180}
    min-co-occurrence: ${RECOMMENDATION_SIMILARITY_MIN_CO_OCCURRENCE:2}
    max-neighbours-per-product: ${RECOMMENDATION_SIMILARITY_MAX_NEIGHBOURS_PER_PRODUCT:50}
  popularity:
    lookback-days: ${RECOMMENDATION_POPULARITY_LOOKBACK_DAYS:30}
  retention:
    interaction-max-age-days: ${RECOMMENDATION_RETENTION_INTERACTION_MAX_AGE_DAYS:180}
  scheduling:
    profile-refresh:
      enabled: ${RECOMMENDATION_SCHEDULING_PROFILE_REFRESH_ENABLED:true}
      delay-ms: ${RECOMMENDATION_SCHEDULING_PROFILE_REFRESH_DELAY_MS:900000}
      batch-size: ${RECOMMENDATION_SCHEDULING_PROFILE_REFRESH_BATCH_SIZE:500}
    item-similarity:
      enabled: ${RECOMMENDATION_SCHEDULING_ITEM_SIMILARITY_ENABLED:true}
      delay-ms: ${RECOMMENDATION_SCHEDULING_ITEM_SIMILARITY_DELAY_MS:3600000}
    popularity:
      enabled: ${RECOMMENDATION_SCHEDULING_POPULARITY_ENABLED:true}
      delay-ms: ${RECOMMENDATION_SCHEDULING_POPULARITY_DELAY_MS:900000}
    prune:
      enabled: ${RECOMMENDATION_SCHEDULING_PRUNE_ENABLED:true}
      delay-ms: ${RECOMMENDATION_SCHEDULING_PRUNE_DELAY_MS:86400000}
      batch-size: ${RECOMMENDATION_SCHEDULING_PRUNE_BATCH_SIZE:1000}
  cache:
    home:
      l1-ttl-seconds: ${RECOMMENDATION_CACHE_HOME_L1_TTL_SECONDS:60}
      l1-max-size: ${RECOMMENDATION_CACHE_HOME_L1_MAX_SIZE:1000}
      l2-ttl-seconds: ${RECOMMENDATION_CACHE_HOME_L2_TTL_SECONDS:900}
    similar:
      l1-ttl-seconds: ${RECOMMENDATION_CACHE_SIMILAR_L1_TTL_SECONDS:300}
      l1-max-size: ${RECOMMENDATION_CACHE_SIMILAR_L1_MAX_SIZE:2000}
      l2-ttl-seconds: ${RECOMMENDATION_CACHE_SIMILAR_L2_TTL_SECONDS:3600}
    trending:
      l1-ttl-seconds: ${RECOMMENDATION_CACHE_TRENDING_L1_TTL_SECONDS:60}
      l1-max-size: ${RECOMMENDATION_CACHE_TRENDING_L1_MAX_SIZE:10}
      l2-ttl-seconds: ${RECOMMENDATION_CACHE_TRENDING_L2_TTL_SECONDS:900}
