name: Publish Shared Modules

on:
  push:
    tags:
      - 'shared-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish shared modules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.4.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#shared-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test shared modules
        env:
          SHARED_VERSION: ${{ steps.version.outputs.value }}
        run: >
          ./gradlew
          :shared:kernel:test
          :shared:contracts:test
          :shared:infrastructure:test
          -PsharedVersion="${SHARED_VERSION}"

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHARED_VERSION: ${{ steps.version.outputs.value }}
        run: >
          ./gradlew
          :shared:kernel:publish
          :shared:contracts:publish
          :shared:infrastructure:publish
          :shared:bom:publish
          -PsharedVersion="${SHARED_VERSION}"
