name: Publish Shared Modules

on:
  push:
    tags:
      - 'shared-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish shared modules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#shared-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test shared modules
        run: >
          ./gradlew
          :shared:kernel:test
          :shared:contracts:test
          :shared:infrastructure:test
          -PsharedVersion=${{ steps.version.outputs.value }}

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          ./gradlew
          :shared:kernel:publish
          :shared:contracts:publish
          :shared:infrastructure:publish
          :shared:bom:publish
          -PsharedVersion=${{ steps.version.outputs.value }}
