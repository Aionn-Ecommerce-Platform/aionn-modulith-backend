version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    # Keep security updates enabled, but disable routine version-update PRs.
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    # Keep security updates enabled, but disable routine version-update PRs.
    open-pull-requests-limit: 0
    labels:
      - dependencies
