server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${APP_NAME:aionn-modulith-backend}

  config:
    import:
      - classpath:application-identity.yml
      - classpath:application-catalog.yml
      - classpath:application-inventory.yml
      - classpath:application-ordering.yml
      - classpath:application-payment.yml
      - classpath:application-shipping.yml
      - classpath:application-promotion.yml
      - classpath:application-notification.yml
      - classpath:application-chat.yml

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_LOCAL_PORT:5434}/${POSTGRES_DB:aionn}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_LOCAL_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_COMMAND_TIMEOUT:5s}

  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT:30s}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db
    out-of-order: true

  mail:
    host: ${SPRING_MAIL_HOST:${DEV_MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${DEV_MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${DEV_MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${DEV_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:10000}
          timeout: ${SMTP_READ_TIMEOUT_MS:15000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:15000}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  upload-base-url: ${CLOUDINARY_UPLOAD_BASE_URL:https://api.cloudinary.com/v1_1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    "[com.aionn]": ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

resilience4j:
  retry:
    configs:
      default:
        max-attempts: ${PROVIDER_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${PROVIDER_RETRY_WAIT:200ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    configs:
      default:
        sliding-window-size: ${PROVIDER_CIRCUIT_WINDOW_SIZE:20}
        minimum-number-of-calls: ${PROVIDER_CIRCUIT_MIN_CALLS:10}
        failure-rate-threshold: ${PROVIDER_CIRCUIT_FAILURE_RATE:50}
        wait-duration-in-open-state: ${PROVIDER_CIRCUIT_OPEN_WAIT:30s}
