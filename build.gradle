plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.sonarqube' version '7.3.1.8318'
}

jacoco {
    toolVersion = '0.8.13'
}

allprojects {
    group = 'com.aionn'
    version = '0.1.0-SNAPSHOT'
}

def sharedVersion = findProperty('sharedVersion') ?: '0.1.0'
def sharedProjects = [':shared:kernel', ':shared:contracts', ':shared:infrastructure']

configure(subprojects.findAll { it.path in sharedProjects }) {
    version = sharedVersion
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = "shared-${project.name}"
                pom {
                    name = "Aionn ${project.name.capitalize()}"
                    description = project.name == 'contracts'
                            ? 'Aionn framework-free integration events and cross-module ports'
                            : project.name == 'kernel'
                                    ? 'Aionn shared domain kernel and application contracts'
                                    : 'Aionn Spring/JPA/Redis platform infrastructure'
                    url = 'https://github.com/Aionn-Ecommerce-Platform/aionn-modulith-backend'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    developers {
                        developer {
                            id = 'aionn-ecommerce-platform'
                            name = 'Aionn Ecommerce Platform'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/Aionn-Ecommerce-Platform/aionn-modulith-backend.git'
                        developerConnection = 'scm:git:ssh://git@github.com/Aionn-Ecommerce-Platform/aionn-modulith-backend.git'
                        url = 'https://github.com/Aionn-Ecommerce-Platform/aionn-modulith-backend'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri(findProperty('githubPackagesUrl')
                        ?: "https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'Aionn-Ecommerce-Platform/aionn-modulith-backend'}")
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
                    password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
                }
            }
        }
    }
}

subprojects {
    if (project.path == ':shared:bom') {
        return
    }
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-parameters', '-Xlint:deprecation'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'file.encoding', 'UTF-8'
        maxHeapSize = '1024m'
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    if (project.name != 'kernel' && project.name != 'contracts') {
        dependencies {
            testImplementation(testFixtures(project(':shared:kernel')))
        }
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'Aionn-Ecommerce-Platform_aionn-modulith-backend'
        property 'sonar.organization', 'aionn-ecommerce-platform'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                subprojects.collect {
                    "${it.layout.buildDirectory.get().asFile.path}/reports/jacoco/test/jacocoTestReport.xml"
                }.join(',')
        property 'sonar.coverage.exclusions', [
                '**/application/dto/**',
                '**/application/mapper/**',
                '**/application/port/**',
                '**/application/usecase/**',
                '**/application/policy/AccountManagementPolicy.java',
                '**/application/policy/AddressPolicy.java',
                '**/application/policy/AgentPolicy.java',
                '**/application/policy/AuthPolicy.java',
                '**/application/policy/IdentityValidationConstants.java',
                '**/application/policy/KycPolicy.java',
                '**/application/policy/MfaPolicy.java',
                '**/application/policy/RegistrationPolicy.java',
                '**/application/policy/Spring*.java',
                '**/adapter/rest/dto/**',
                '**/adapter/rest/mapper/**',
                '**/adapter/rest/support/**',
                '**/adapter/rest/exception/**',
                '**/adapter/rest/config/**',
                '**/domain/event/**',
                '**/domain/valueobject/**',
                '**/infrastructure/config/**',
                '**/infrastructure/persistence/entity/**',
                '**/infrastructure/persistence/mapper/**',
                '**/infrastructure/persistence/repository/**',
                '**/infrastructure/persistence/adapter/**',
                '**/infrastructure/observability/**',
                '**/infrastructure/integration/**',
                '**/infrastructure/gateway/**',
                '**/infrastructure/scheduling/**',
                '**/infrastructure/listener/**',
                '**/infrastructure/search/OpenSearchProductSearchIndex.java',
                '**/infrastructure/search/OpenSearchConfig.java'
        ].join(',')
    }
}
